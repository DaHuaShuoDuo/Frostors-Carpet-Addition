name: Publish Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag, for example v0.2.1-beta.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mod_version: ${{ steps.release.outputs.mod_version }}
      release_type: ${{ steps.release.outputs.release_type }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Validate tag and publishing configuration
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          set -euo pipefail

          missing=()
          [[ -n "$MODRINTH_PROJECT_ID" ]] || missing+=("MODRINTH_PROJECT_ID repository variable")
          [[ -n "$CURSEFORGE_PROJECT_ID" ]] || missing+=("CURSEFORGE_PROJECT_ID repository variable")
          [[ -n "$MODRINTH_TOKEN" ]] || missing+=("MODRINTH_TOKEN repository secret")
          [[ -n "$CURSEFORGE_TOKEN" ]] || missing+=("CURSEFORGE_TOKEN repository secret")
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing release configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          tag="$RELEASE_TAG"
          [[ "$tag" == v* ]] || {
            echo "Release tag must start with v: $tag" >&2
            exit 1
          }
          mod_version="$(sed -nE \
            's/^[[:space:]]*mod_version[[:space:]]*=[[:space:]]*//p' \
            gradle.properties | head -n 1)"
          [[ -n "$mod_version" ]] || {
            echo "gradle.properties does not define mod_version." >&2
            exit 1
          }
          [[ "$tag" == "v${mod_version}" ]] || {
            echo "Tag $tag does not match mod_version=$mod_version." >&2
            exit 1
          }

          version="${tag#v}"
          if [[ "$version" == *-alpha* ]]; then
            release_type="alpha"
          elif [[ "$version" == *-beta* || "$version" == *-rc* ||
            "$version" == *-* || "$RELEASE_PRERELEASE" == "true" ]]; then
            release_type="beta"
          else
            release_type="release"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "mod_version=$mod_version" >> "$GITHUB_OUTPUT"
          echo "release_type=$release_type" >> "$GITHUB_OUTPUT"

  build:
    name: Build release JARs
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Download compile dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for MC_VERSION in 26.2 26.3; do
            mkdir -p libs ".ci/carpet-${MC_VERSION}" ".ci/quickshulker-${MC_VERSION}"
            gh release download "v${MC_VERSION}" \
              --repo gnembon/fabric-carpet \
              --pattern "fabric-carpet-${MC_VERSION}*.jar" \
              --dir ".ci/carpet-${MC_VERSION}" \
              --clobber
            carpet_jar="$(find ".ci/carpet-${MC_VERSION}" \
              -maxdepth 1 -name '*.jar' -print -quit)"
            test -n "$carpet_jar"
            cp "$carpet_jar" "libs/fabric-carpet-${MC_VERSION}.jar"

            quickshulker_version="$(sed -n 's/^[[:space:]]*quickshulker_version=//p' \
              "versions/${MC_VERSION}/gradle.properties")"
            test -n "$quickshulker_version"
            gh release download "$quickshulker_version" \
              --repo MoRanpcy/quickshulker \
              --pattern "*.jar" \
              --dir ".ci/quickshulker-${MC_VERSION}" \
              --clobber
            quickshulker_jar="$(find ".ci/quickshulker-${MC_VERSION}" \
              -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' -print -quit)"
            test -n "$quickshulker_jar"
            cp "$quickshulker_jar" "libs/quickshulker-${MC_VERSION}.jar"
          done

      - name: Build and test both Minecraft versions
        run: ./gradlew :26.2:build :26.3:build --warning-mode all

      - name: Select and verify release artifacts
        env:
          MOD_VERSION: ${{ needs.prepare.outputs.mod_version }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          for MC_VERSION in 26.2 26.3; do
            mapfile -t jars < <(find "versions/${MC_VERSION}/build/libs" \
              -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' -print)
            if (( ${#jars[@]} != 1 )); then
              printf 'Expected one Minecraft %s release JAR, found %s.\n' \
                "$MC_VERSION" "${#jars[@]}" >&2
              exit 1
            fi

            release_jar="release-artifacts/frostors-carpet-addition-${MOD_VERSION}-fabric-${MC_VERSION}.jar"
            cp "${jars[0]}" "$release_jar"
            unzip -p "$release_jar" fabric.mod.json > ".ci/fabric-${MC_VERSION}.json"
            jq -e '.depends.carpet != null and .environment == "*"' \
              ".ci/fabric-${MC_VERSION}.json"
            if unzip -Z1 "$release_jar" | grep -q '^carpet/'; then
              echo "Carpet classes were bundled into $release_jar" >&2
              exit 1
            fi
            if unzip -Z1 "$release_jar" | grep -q '^net/kyrptonaught/'; then
              echo "Quick Shulker classes were bundled into $release_jar" >&2
              exit 1
            fi
          done

      - name: Upload release JARs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-jars
          path: release-artifacts/*.jar
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish Minecraft ${{ matrix.minecraft }}
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        minecraft:
          - "26.2"
          - "26.3"
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Download release JARs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-jars
          path: release-artifacts

      - name: Prepare release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          set -euo pipefail
          mkdir -p .ci
          notes="${RELEASE_BODY:-}"
          if [[ -z "$notes" ]]; then
            notes="$(gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json body \
              --jq '.body')"
          fi
          if [[ -z "$notes" ]]; then
            notes="Release ${RELEASE_TAG}."
          fi
          printf '%s\n' "$notes" > .ci/release-notes.md

      - name: Publish to Modrinth and CurseForge
        uses: Kira-NT/mc-publish@c23376546a97f5ba7984e94445da359459b14419
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: release-artifacts/frostors-carpet-addition-${{ needs.prepare.outputs.mod_version }}-fabric-${{ matrix.minecraft }}.jar
          name: Frostor's Carpet Addition ${{ needs.prepare.outputs.mod_version }} for Minecraft ${{ matrix.minecraft }}
          version: ${{ needs.prepare.outputs.mod_version }}+${{ matrix.minecraft }}
          version-type: ${{ needs.prepare.outputs.release_type }}
          changelog-file: .ci/release-notes.md
          loaders: fabric
          environment: "client | server"
          game-versions: "${{ matrix.minecraft }}"
          game-version-filter: none
          java: "Java 25"
          retry-attempts: 3
          retry-delay: 15000
          fail-mode: fail
