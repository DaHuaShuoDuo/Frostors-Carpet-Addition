name: Build

on:
  push:
    paths:
      - ".github/workflows/**"
      - "src/**"
      - "versions/**/gradle.properties"
      - "build.gradle"
      - "common.gradle"
      - "gradle.properties"
      - "gradle/wrapper/**"
      - "LICENSE"
      - "settings.gradle"
      - "THIRD_PARTY_NOTICES.md"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "src/**"
      - "versions/**/gradle.properties"
      - "build.gradle"
      - "common.gradle"
      - "gradle.properties"
      - "gradle/wrapper/**"
      - "LICENSE"
      - "settings.gradle"
      - "THIRD_PARTY_NOTICES.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Minecraft ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        minecraft:
          - "26.2"
          - "26.3"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Download Carpet compile dependency
        env:
          GH_TOKEN: ${{ github.token }}
          MC_VERSION: ${{ matrix.minecraft }}
        run: |
          mkdir -p libs .ci/carpet
          gh release download "v${MC_VERSION}" \
            --repo gnembon/fabric-carpet \
            --pattern "fabric-carpet-${MC_VERSION}*.jar" \
            --dir .ci/carpet \
            --clobber
          carpet_jar="$(find .ci/carpet -maxdepth 1 -name '*.jar' -print -quit)"
          test -n "$carpet_jar"
          cp "$carpet_jar" "libs/fabric-carpet-${MC_VERSION}.jar"

      - name: Build and test
        env:
          MC_VERSION: ${{ matrix.minecraft }}
        run: ./gradlew ":${MC_VERSION}:build" --warning-mode all

      - name: Verify artifact boundaries
        env:
          MC_VERSION: ${{ matrix.minecraft }}
        run: |
          main_jar="$(find "versions/${MC_VERSION}/build/libs" \
            -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "$main_jar"
          unzip -p "$main_jar" fabric.mod.json > .ci/fabric.mod.json
          jq -e '.depends.carpet != null and .environment == "*"' .ci/fabric.mod.json
          if unzip -Z1 "$main_jar" | grep '^carpet/' > /dev/null; then
            echo "::error::Carpet classes were bundled into $main_jar"
            exit 1
          fi
          echo "Verified $main_jar"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: frostors-carpet-addition-${{ matrix.minecraft }}
          path: versions/${{ matrix.minecraft }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
