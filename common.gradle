apply plugin: 'net.fabricmc.fabric-loom'
apply plugin: 'maven-publish'

version = project.mod_version
group = project.maven_group

base {
	archivesName = "${project.archives_base_name}-fabric-${project.minecraft_version}"
}

sourceSets {
	main {
		java.srcDirs = [rootProject.file('src/main/java')]
		resources.srcDirs = [rootProject.file('src/main/resources')]
	}
	test {
		java.srcDirs = [rootProject.file('src/test/java')]
		resources.srcDirs = [rootProject.file('src/test/resources')]
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Carpet is supplied by the player at runtime; the local JAR is only for compilation and dev runs.
	compileOnly files(rootProject.file("libs/fabric-carpet-${project.minecraft_version}.jar"))
}

loom {
	mixin {
		// minecraft 26.x is unobfuscated, so there is no need to generate remap refmaps
		useLegacyMixinAp = false
	}
}

def processedVersion = project.version.toString()
def minecraftDependency = project.minecraft_dependency
def fabricLoaderDependency = project.fabricloader_dependency
def fabricApiDependency = project.fabric_api_dependency
def carpetDependency = project.carpet_dependency

processResources {
	inputs.property "version", processedVersion
	inputs.property "minecraft_dependency", minecraftDependency
	inputs.property "fabricloader_dependency", fabricLoaderDependency
	inputs.property "fabric_api_dependency", fabricApiDependency
	inputs.property "carpet_dependency", carpetDependency

	filesMatching("fabric.mod.json") {
		expand "version": processedVersion,
				"minecraft_dependency": minecraftDependency,
				"fabricloader_dependency": fabricLoaderDependency,
				"fabric_api_dependency": fabricApiDependency,
				"carpet_dependency": carpetDependency
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 25
	options.encoding = "UTF-8"
	options.compilerArgs += ["-Xlint:deprecation"]
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25

	withSourcesJar()
}

def archiveBaseName = project.base.archivesName.get()
jar {
	from(rootProject.file('LICENSE')) {
		rename { "${it}_${archiveBaseName}" }
	}
	from(rootProject.file('THIRD_PARTY_NOTICES.md')) {
		rename { "THIRD_PARTY_NOTICES_${archiveBaseName}.md" }
	}
}

def testRuntimeClasspath = sourceSets.test.runtimeClasspath
tasks.register("logicTest", JavaExec) {
	group = "verification"
    description = "Runs dependency-free tests for player stack and big ender chest logic."
	dependsOn testClasses
	classpath = testRuntimeClasspath
    mainClass = "top.frostor.carpet.LogicTestSuite"
}

tasks.register("easyPlaceProtocolTest", JavaExec) {
	group = "verification"
	description = "Runs dependency-free tests for the V2-Extra protocol bit layout."
	dependsOn testClasses
	classpath = testRuntimeClasspath
	mainClass = "top.frostor.carpet.easyplace.EasyPlaceExtraProtocolTest"
}

tasks.named("test").configure {
	failOnNoDiscoveredTests = false
}

tasks.named("check").configure {
	dependsOn "logicTest", "easyPlaceProtocolTest"
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
}
